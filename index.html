<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAGE Bristol</title>
  <link rel="stylesheet" href="styles/main.css?v=10" />
</head>
<body data-page="home">
  <div id="site-header"></div>

  <div class="hero-banner hero-photo">
    <div class="wrap">
      <span class="hero-tag">University of Bristol</span>
    </div>
  </div>

  <div class="wrap">
    <div class="page-intro">
      <h1 id="home-group-name"></h1>
      <p id="home-description"></p>
    </div>

    <section>
      <h2>Research themes</h2>
      <div class="card-grid" id="home-research"></div>
      <p style="text-align: center; margin-top: 18px">
        <a href="research.html">See all research &rarr;</a>
      </p>
    </section>

    <section>
      <h2>Latest news</h2>
      <ul class="news-list" id="home-news"></ul>
      <p style="text-align: right; margin-top: 12px">
        <a href="news.html">See all news &rarr;</a>
      </p>
    </section>

    <section>
      <h2>Affiliations</h2>
      <p id="about-affiliations"></p>
    </section>

    <section>
      <h2>Location</h2>
      <p>
        We are based in the <span id="about-building"></span>, <span id="about-university"></span>,
        on <span id="about-street"></span>, <span id="about-city"></span>, <span id="about-postcode"></span>.
      </p>
      <div id="about-map"></div>
    </section>
  </div>

  <div id="site-footer"></div>

  <script src="scripts/data.js?v=11"></script>
  <script src="scripts/shared.js?v=10"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("home-group-name").textContent = SITE.groupName;
      document.getElementById("home-description").textContent = SITE.description;

      document.getElementById("about-building").textContent = SITE.buildingName;
      document.getElementById("about-university").textContent = SITE.university;
      document.getElementById("about-street").textContent = SITE.street;
      document.getElementById("about-city").textContent = SITE.city;
      document.getElementById("about-postcode").textContent = SITE.postcode;

      document.getElementById("about-affiliations").innerHTML = SITE.affiliations
        .map((a) => `<a href="${a.href}">${a.label}</a>`)
        .join(" &middot; ");

      const mapSrc =
        SITE.mapEmbedUrl && SITE.mapEmbedUrl.includes("/maps/embed")
          ? SITE.mapEmbedUrl
          : `https://www.google.com/maps?q=${encodeURIComponent(
              [SITE.buildingName, SITE.university, SITE.street, SITE.city, SITE.postcode].join(", ")
            )}&output=embed`;
      document.getElementById("about-map").innerHTML =
        `<iframe src="${mapSrc}" width="100%" height="320" style="border:0" loading="lazy"></iframe>`;

      document.getElementById("home-research").innerHTML = RESEARCH.slice(0, 3)
        .map((r) => `<div class="card"><h3>${r.title}</h3><p>${r.description}</p></div>`)
        .join("");

      document.getElementById("home-news").innerHTML = NEWS.slice(0, 5)
        .map(
          (n) =>
            `<li><span class="news-date">${formatDate(n.date)}</span><span>${n.text}</span></li>`
        )
        .join("");
    });
  </script>
</body>
</html>
